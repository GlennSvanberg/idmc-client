[workspace]
resolver = "2"
members = ["crates/model", "crates/backend", "crates/layout", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
idmc-model = { path = "crates/model" }
idmc-backend = { path = "crates/backend" }
idmc-layout = { path = "crates/layout" }

[profile.dev]
debug = 0

# GPUI and the HTTP stack stay optimized in debug builds. This crate is left
# at opt-level 0 so incremental compiles stay short. `cargo run --release` is
# the build to use against a live org.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 0

# gpui 0.2.2 -> zed-async-tar -> xattr 0.2.3, which names libc::ENOATTR.
# That constant is gone from libc 0.2.191. See third_party/xattr.
[patch.crates-io]
xattr = { path = "third_party/xattr" }
