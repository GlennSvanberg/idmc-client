[package]
name = "xattr"
version = "0.2.3"
authors = ["Steven Allen <steven@stebalien.com>"]
description = "unix extended filesystem attributes"
documentation = "https://docs.rs/xattr"
repository = "https://github.com/Stebalien/xattr"
keywords = ["xattr", "filesystem", "unix"]
license = "MIT/Apache-2.0"
publish = false

# Vendored from crates.io 0.2.3 with one Linux fix: libc 0.2.191 dropped
# ENOATTR. On Linux the missing-attribute errno is ENODATA. gpui 0.2.2 pulls
# this crate through zed-async-tar and will not build on current glibc libc
# without the substitution.

[features]
default = ["unsupported"]
unsupported = []

[dependencies]
libc = "0.2"
