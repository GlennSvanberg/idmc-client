name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config g++ cmake gcc-mingw-w64-x86-64 \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libx11-xcb-dev libssl-dev
          # Rust's bundled lld looks up libstdc++.so on the default path. The
          # dev symlink ships under the GCC directory.
          sudo ln -sfn "$(g++ -print-file-name=libstdc++.so)" /usr/lib/x86_64-linux-gnu/libstdc++.so
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      # cfg(windows) is not compiled by the host build. The gnu target
      # typechecks it on Ubuntu. The msvc target needs a Windows SDK, which
      # this runner does not have (ring's C build fails without it).
      - name: Check Windows
        run: cargo check --workspace --locked --target x86_64-pc-windows-gnu
